<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Usage</title>
<script src="/preload.js"></script>
<style>
  :root {
    --c-system: #9aa0a6;
    --c-user: #a8c7fa;
    --c-agent: #4c8df6;
    --c-tool: #f9ab00;
    --c-custom: #c58af9;
    --c-sysmsg: #f28b82;
    --fg: var(--foreground, #e3e3e3);
    --dim: var(--muted-foreground, #9aa0a6);
    --line: var(--border, rgba(127, 127, 127, .22));
    --empty: color-mix(in srgb, var(--dim) 28%, transparent);
    --surface: color-mix(in srgb, var(--fg) 4%, transparent);
    --surface-hover: color-mix(in srgb, var(--fg) 7%, transparent);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-button { display: none; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--dim) 30%, transparent);
    border: 3px solid transparent;
    border-radius: 999px;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--dim) 55%, transparent); }

  main { padding: 12px 14px 18px; }
  .dim { color: var(--dim); }
  .num { font-variant-numeric: tabular-nums; }

  /* header */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .model { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .live { width: 6px; height: 6px; border-radius: 50%; background: var(--empty); flex: none; }
  .live.on { background: #81c995; }
  .usage { margin: 2px 0 12px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .usage .big { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
  .usage .of { color: var(--dim); }
  .usage .pct { margin-left: auto; font-size: 13px; font-weight: 600; }
  button {
    font: inherit; font-size: 11.5px; color: var(--dim); cursor: pointer; white-space: nowrap;
    background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 2.5px 8px;
    transition: color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  button:hover { color: var(--fg); border-color: var(--dim); background: var(--surface); }

  /* grid: each dot is 1% of the context window */
  .grid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; max-width: 320px; margin-bottom: 4px; }
  .dot { aspect-ratio: 1; border-radius: 50%; background: var(--empty); }

  /* sections */
  section { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; }
  h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .note { font-size: 12px; color: var(--dim); margin: -2px 0 8px; }
  .group + .group { margin-top: 8px; }
  .row { display: grid; grid-template-columns: 10px 1fr auto 42px; align-items: center; gap: 8px; padding: 2.5px 0; }
  .row .tok { text-align: right; }
  .row .p { text-align: right; color: var(--dim); font-size: 12px; }
  .mark { width: 8px; height: 8px; border-radius: 50%; }
  .mark.sq { border-radius: 2px; }
  .mark.free { background: transparent; border: 1.5px solid var(--empty); }

  /* context growth curve */
  .curve-card {
    border-radius: 8px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--fg) 2%, transparent);
    padding: 10px 10px 8px;
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .curve-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11px;
    color: var(--dim);
    gap: 8px;
    flex-wrap: wrap;
  }
  .curve-title {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .curve-badge {
    font-size: 10px;
    font-weight: 500;
    padding: 0 5px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--c-agent) 12%, transparent);
    color: var(--c-agent);
    border: 1px solid color-mix(in srgb, var(--c-agent) 30%, transparent);
    text-transform: none;
    letter-spacing: 0;
  }
  .curve-info {
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--dim);
  }
  .curve-info strong {
    color: var(--fg);
    font-weight: 600;
  }
  .curve-chart-wrap {
    position: relative;
    width: 100%;
    user-select: none;
    touch-action: none;
  }
  .curve-svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }
  .curve-tooltip {
    min-height: 24px;
    font-size: 11px;
    line-height: 1.35;
    padding: 4px 8px;
    border-radius: 6px;
    background: color-mix(in srgb, var(--fg) 3%, transparent);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    overflow: hidden;
  }
  .curve-tooltip-main {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .curve-tooltip-preview {
    color: var(--dim);
    font-size: 10.5px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .curve-legend {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--dim);
    padding: 6px 4px 2px;
    border-top: 1px solid var(--line);
    margin-top: 2px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .curve-legend-items {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .curve-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--fg);
    opacity: 0.9;
    white-space: nowrap;
  }

  /* interactive per-turn inspector (DeepSeek Harness style) */
  .turn-list { display: flex; flex-direction: column; gap: 2px; }
  details.turn-item {
    border-radius: 7px;
    border: 1px solid transparent;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  details.turn-item:hover {
    background: var(--surface);
  }
  details.turn-item[open] {
    background: var(--surface);
    border-color: var(--line);
    margin: 2px 0;
  }
  summary.turn-summary {
    list-style: none;
    display: grid;
    grid-template-columns: 12px 36px 1fr 68px 46px 54px;
    align-items: center;
    gap: 6px;
    padding: 5px 6px;
    font-size: 11.5px;
    cursor: pointer;
    user-select: none;
  }
  summary.turn-summary::-webkit-details-marker { display: none; }
  .turn-chev {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    opacity: 0.65;
    transition: transform 0.14s ease;
  }
  details.turn-item[open] .turn-chev {
    transform: rotate(90deg);
    color: var(--fg);
    opacity: 0.9;
  }
  .turn-main {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
  }
  .turn-tag {
    font-size: 10px;
    line-height: 1.3;
    padding: 0 5px;
    border-radius: 4px;
    color: var(--dim);
    border: 1px solid var(--line);
    flex: none;
  }
  .turn-tag.user {
    color: var(--c-user);
    border-color: color-mix(in srgb, var(--c-user) 35%, transparent);
  }

  .turn-detail {
    border-top: 1px solid var(--line);
    padding: 9px 10px 10px;
    font-size: 11.5px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .td-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--dim);
    flex-wrap: wrap;
  }
  .td-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  @media (max-width: 340px) {
    .td-cards { grid-template-columns: 1fr; }
  }
  .td-card {
    padding: 7px 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--fg) 2%, transparent);
    display: flex;
    flex-direction: column;
    gap: 3.5px;
  }
  .td-card-title {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--dim);
    margin-bottom: 1px;
  }
  .td-bar {
    height: 3px;
    border-radius: 999px;
    background: var(--empty);
    overflow: hidden;
    display: flex;
    margin-bottom: 3px;
  }
  .td-kv {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
    font-size: 11px;
  }
  .td-kv .k { color: var(--dim); }
  .td-kv .v { font-variant-numeric: tabular-nums; font-weight: 500; }

  .td-box {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--fg) 2%, transparent);
  }
  .td-box-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--dim);
    margin-bottom: 4px;
  }
  .td-snippet {
    font-size: 11.5px;
    line-height: 1.4;
    color: var(--fg);
    opacity: 0.88;
    word-break: break-word;
  }
  .td-tools {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .td-tool-row {
    display: grid;
    grid-template-columns: 13px auto 1fr auto;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    padding: 2px 0;
  }
  .td-tool-icon {
    display: inline-flex;
    align-items: center;
    color: var(--dim);
    opacity: 0.7;
  }
  .td-tool-name {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px;
    color: var(--c-tool);
    white-space: nowrap;
  }
  .td-tool-sum {
    color: var(--dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .td-tool-tok {
    color: var(--fg);
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }

  .files li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 3px 0; }
  .files .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files .dir { display: block; font-size: 11.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .files .tok { color: var(--dim); font-size: 12px; align-self: start; }
  ul { list-style: none; margin: 0; padding: 0; }
  .ck-main { display: flex; justify-content: space-between; gap: 8px; }
  .badge { font-size: 11px; color: #81c995; border: 1px solid color-mix(in srgb, #81c995 40%, transparent); border-radius: 999px; padding: 0 7px; white-space: nowrap; }

  .empty { margin: 48px 8px; text-align: center; color: var(--dim); }
  footer { margin-top: 16px; font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<main id="main"><p class="empty">Loading…</p></main>

<script>
(() => {
  const POLL_MS = 3000;
  const SEGMENT_COLORS = ['var(--c-system)', 'var(--c-user)', 'var(--c-agent)', 'var(--c-tool)', 'var(--c-custom)'];
  const CONVERSATION = { user: 'var(--c-user)', agent: 'var(--c-agent)', tool: 'var(--c-tool)', system_messages: 'var(--c-sysmsg)' };
  const SYSTEM = new Set(['system_prompt', 'system_tools', 'system_overhead']);
  const params = new URLSearchParams(location.search);
  const initialConversationId = (window.sidecar && window.sidecar.conversationId) || params.get('conversationId') || '';
  const doFetch = (window.sidecar && window.sidecar.fetch) || fetch;
  const main = document.getElementById('main');
  let workspace = '';
  let report = null;
  let lastJson = '';
  let selectedTurnStep = null;
  let showAllTurns = false;

  const SVG_CHEVRON = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  const SVG_TOOL = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>';

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function fmtTok(n) {
    const val = Number(n) || 0;
    if (val >= 1e6) { const v = val / 1e6; return Number.isInteger(v) ? `${v}M` : `${v.toFixed(1)}M`; }
    if (val >= 1e3) return `${(val / 1e3).toFixed(1)}k`;
    return String(val);
  }

  function gridCells(segments, limit, total) {
    let counts = segments.map((t) => (!t || !limit ? 0 : Math.max(1, Math.floor(t / limit * total))));
    const used = counts.reduce((a, b) => a + b, 0);
    if (used > total) counts = counts.map((c) => Math.floor(c * total / used));
    return [...counts, total - counts.reduce((a, b) => a + b, 0)];
  }

  function grid(r) {
    const counts = gridCells(r.grid_segments, r.limit_tokens, 100);
    let dots = '';
    counts.forEach((n, i) => {
      dots += (i === 5 ? '<span class="dot"></span>' : `<span class="dot" style="background:${SEGMENT_COLORS[i]}"></span>`).repeat(n);
    });
    return `<div class="grid" title="Each dot is 1% of the context window">${dots}</div>`;
  }

  function categoryRow(c) {
    const color = CONVERSATION[c.key] || (SYSTEM.has(c.key) ? 'var(--c-system)' : 'var(--c-custom)');
    const shape = CONVERSATION[c.key] ? '' : ' sq';
    return `<div class="row"><span class="mark${shape}" style="background:${color}"></span><span>${esc(c.name)}</span>`
      + `<span class="tok num">${fmtTok(c.tokens)}</span><span class="p num">${c.pct.toFixed(1)}%</span></div>`;
  }

  function categories(r) {
    const conv = r.categories.filter((c) => CONVERSATION[c.key]);
    const rest = r.categories.filter((c) => !CONVERSATION[c.key]);
    const limit = r.limit_tokens;
    const freePct = limit ? (r.free_tokens / limit * 100).toFixed(1) : '0.0';
    const free = `<div class="row"><span class="mark free"></span><span class="dim">Free space</span>`
      + `<span class="tok num">${fmtTok(r.free_tokens)}</span><span class="p num">${freePct}%</span></div>`;
    const note = r.heading === 'Token usage by category' ? '' : `<p class="note">${esc(r.heading)}</p>`;
    const buffer = r.checkpoint_buffer
      ? `<p class="note">Checkpoint buffer: ${fmtTok(r.checkpoint_buffer)} tokens (not counted in usage)</p>` : '';
    return `<section><h2>Token usage</h2>${note}
      <div class="group">${conv.map((c) => categoryRow(c)).join('')}</div>
      ${rest.length ? `<div class="group">${rest.map((c) => categoryRow(c)).join('')}</div>` : ''}
      <div class="group">${free}</div>${buffer}</section>`;
  }

  function checkpoints(r) {
    const ck = r.checkpoint_view;
    if (!ck) return '';
    const older = ck.historical ? `<div class="dim" style="font-size:12px">${ck.historical} older checkpoint(s) summarized, not in context</div>` : '';
    return `<section><h2>Checkpoints <span class="hint">${ck.count} · /rewind</span></h2>
      <div class="ck-main"><span>Checkpoint ${ck.active_number}: ${esc(ck.active_text)}</span><span class="badge">in context</span></div>${older}</section>`;
  }

  function splitPath(path, activeConvId) {
    const trimmed = path.replace(/\/$/, '');
    const i = trimmed.lastIndexOf('/');
    const name = trimmed.slice(i + 1) + (path.endsWith('/') ? '/' : '');
    let dir = i > 0 ? trimmed.slice(0, i) : '';
    const cid = activeConvId || initialConversationId;
    if (cid) dir = dir.replace(new RegExp(`^.*/brain/${cid}`), 'conversation folder');
    return { name, dir };
  }

  function files(title, hint, items, activeConvId) {
    if (!items || !items.length) return '';
    const rows = items.map((f) => {
      const { name, dir } = splitPath(f.path, activeConvId);
      return `<li title="${esc(f.path)}"><span class="name">${esc(name)}<span class="dir">‎${esc(dir)}</span></span>`
        + `<span class="tok num">${f.tokens > 0 ? fmtTok(f.tokens) : ''}</span></li>`;
    }).join('');
    return `<section><h2>${title} <span class="hint">${hint}</span></h2><ul class="files">${rows}</ul></section>`;
  }

  function fmtSec(ms) {
    if (!ms || ms <= 0) return '0.00s';
    if (ms < 1000) return `${ms}ms`;
    return `${(ms / 1000).toFixed(2)}s`;
  }

  function makeSmoothPath(pts) {
    if (!pts || !pts.length) return '';
    if (pts.length === 1) return `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
    if (pts.length === 2) return `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)} L ${pts[1].x.toFixed(1)} ${pts[1].y.toFixed(1)}`;
    let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i === 0 ? i : i - 1];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2 < pts.length ? i + 2 : i + 1];
      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    }
    return d;
  }

  function calculateYScale(maxVal) {
    const target = Math.max(100, maxVal * 1.08);
    const roughStep = target / 3;
    const pow = Math.pow(10, Math.max(0, Math.floor(Math.log10(roughStep))));
    const frac = roughStep / pow;
    let step;
    if (frac <= 1.5) step = 1 * pow;
    else if (frac <= 3.5) step = 2 * pow;
    else if (frac <= 7.5) step = 5 * pow;
    else step = 10 * pow;
    const yMax = Math.ceil(target / step) * step;
    const ticks = [];
    for (let v = 0; v <= yMax; v += step) {
      ticks.push(v);
    }
    return { yMax, ticks };
  }

  function growthCurveSection(r) {
    const t = r.telemetry;
    if (!t || !Array.isArray(t.turns_curve) || !t.turns_curve.length) return '';
    const curve = t.turns_curve;
    const N = curve.length;
    const pStart = curve[0];
    const pLatest = curve[N - 1];
    const growth = (pLatest.prompt_tokens || 0) - (pStart.prompt_tokens || 0);

    const maxTok = Math.max(...curve.map((c) => c.prompt_tokens || 0), 100);
    const { yMax, ticks } = calculateYScale(maxTok);

    const svgW = 340;
    const svgH = 150;
    const padL = 46;
    const padR = 14;
    const padT = 18;
    const padB = 26;
    const plotW = svgW - padL - padR;
    const plotH = svgH - padT - padB;
    const plotBottom = padT + plotH;
    const plotRight = padL + plotW;

    const pts = curve.map((turn, i) => {
      const x = N > 1 ? padL + (i / (N - 1)) * plotW : padL + plotW / 2;
      const y = plotBottom - Math.min(plotH, Math.max(0, ((turn.prompt_tokens || 0) / yMax) * plotH));
      return { x, y, turn, i };
    });

    const gridLinesHtml = ticks.map((v) => {
      const y = plotBottom - (v / yMax) * plotH;
      return `
        <line x1="${padL}" y1="${y.toFixed(1)}" x2="${plotRight}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-dasharray="3,3" opacity="0.6"/>
        <text x="${padL - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" fill="var(--dim)" font-size="9" class="num">${fmtTok(v)}</text>
      `;
    }).join('');

    const axisBottomHtml = `<line x1="${padL}" y1="${plotBottom}" x2="${plotRight}" y2="${plotBottom}" stroke="var(--line)"/>`;

    let xTickIndices = [];
    if (N <= 6) {
      xTickIndices = curve.map((_, idx) => idx);
    } else {
      xTickIndices = [0, Math.floor(N * 0.25), Math.floor(N * 0.5), Math.floor(N * 0.75), N - 1];
      xTickIndices = [...new Set(xTickIndices)];
    }
    const xTicksHtml = xTickIndices.map((idx) => {
      const pt = pts[idx];
      return `
        <line x1="${pt.x.toFixed(1)}" y1="${plotBottom}" x2="${pt.x.toFixed(1)}" y2="${plotBottom + 3}" stroke="var(--line)"/>
        <text x="${pt.x.toFixed(1)}" y="${plotBottom + 13}" text-anchor="middle" fill="var(--dim)" font-size="9" class="num">#${pt.turn.step}</text>
      `;
    }).join('');

    let pathHtml = '';
    if (N === 1) {
      pathHtml = `
        <line x1="${padL}" y1="${pts[0].y.toFixed(1)}" x2="${plotRight}" y2="${pts[0].y.toFixed(1)}" stroke="var(--c-agent)" stroke-width="1.8" stroke-dasharray="4,4"/>
        <circle cx="${pts[0].x.toFixed(1)}" cy="${pts[0].y.toFixed(1)}" r="4" fill="var(--c-agent)" stroke="var(--surface)" stroke-width="1.5"/>
      `;
    } else {
      const lineD = makeSmoothPath(pts);
      const areaD = `${lineD} L ${pts[N - 1].x.toFixed(1)} ${plotBottom} L ${pts[0].x.toFixed(1)} ${plotBottom} Z`;
      pathHtml = `
        <path d="${areaD}" fill="url(#growth-area-grad)"/>
        <path d="${lineD}" fill="none" stroke="var(--c-agent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      `;
    }

    const dotsHtml = pts.map((pt) => {
      const isUser = Boolean(pt.turn.user_prompt);
      const isDrop = pt.turn.context_delta < 0;
      if (N > 32 && !isUser && !isDrop && pt.i !== 0 && pt.i !== N - 1) {
        return '';
      }
      const r = isUser ? 3.5 : (isDrop ? 3.2 : 2.2);
      const color = isDrop ? '#81c995' : (isUser ? 'var(--c-user)' : 'var(--c-agent)');
      return `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="${r}" fill="${color}" stroke="var(--surface)" stroke-width="1.2"/>`;
    }).join('');

    const hasDrops = pts.some((p) => p.turn.context_delta < 0);
    const budget = Number(r.request_budget_tokens) || 0;
    let budgetLineHtml = '';
    let budgetLegendHtml = '';
    if (budget > 0 && budget <= yMax) {
      const budgetY = plotBottom - (budget / yMax) * plotH;
      budgetLineHtml = `
        <line x1="${padL}" y1="${budgetY.toFixed(1)}" x2="${plotRight}" y2="${budgetY.toFixed(1)}" stroke="#f28b82" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.85"/>
        <text x="${plotRight}" y="${(budgetY - 3).toFixed(1)}" text-anchor="end" fill="#f28b82" font-size="8.5" font-weight="500">Budget ${fmtTok(budget)}</text>
      `;
      budgetLegendHtml = `
        <span class="curve-legend-item">
          <svg width="16" height="8" viewBox="0 0 16 8" style="flex:none;">
            <line x1="0" y1="4" x2="16" y2="4" stroke="#f28b82" stroke-width="1.6" stroke-dasharray="3,2"/>
          </svg>
          <span>Budget (${fmtTok(budget)})</span>
        </span>
      `;
    } else if (budget > 0) {
      budgetLegendHtml = `<span class="dim num">Budget ${fmtTok(budget)}</span>`;
    }

    return `
      <section>
        <h2>
          <span>Context Growth Curve</span>
          <span class="hint num">${N} turns</span>
        </h2>
        <div class="curve-card">
          <div class="curve-header">
            <div class="curve-title">
              <span class="curve-badge num">#${pStart.step} → #${pLatest.step}</span>
            </div>
            <div class="curve-info">
              Start: <strong>${fmtTok(pStart.prompt_tokens)}</strong> · Latest: <strong>${fmtTok(pLatest.prompt_tokens)}</strong>
              <span class="dim">(${growth >= 0 ? '+' : ''}${fmtTok(growth)})</span>
            </div>
          </div>
          <div class="curve-chart-wrap" id="curve-wrap">
            <svg class="curve-svg" viewBox="0 0 ${svgW} ${svgH}" role="img" aria-label="Context growth curve showing tokens per turn">
              <defs>
                <linearGradient id="growth-area-grad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="var(--c-agent)" stop-opacity="0.32"/>
                  <stop offset="75%" stop-color="var(--c-agent)" stop-opacity="0.06"/>
                  <stop offset="100%" stop-color="var(--c-agent)" stop-opacity="0"/>
                </linearGradient>
              </defs>
              ${gridLinesHtml}
              ${budgetLineHtml}
              ${axisBottomHtml}
              ${xTicksHtml}
              <text x="${padL}" y="11" fill="var(--dim)" font-size="9.5" font-weight="500">context (tokens)</text>
              <text x="${plotRight}" y="146" text-anchor="end" fill="var(--dim)" font-size="9.5" font-weight="500">turn →</text>
              ${pathHtml}
              ${dotsHtml}
              <line id="curve-crosshair" x1="0" y1="${padT}" x2="0" y2="${plotBottom}" stroke="var(--dim)" stroke-width="1" stroke-dasharray="2,2" opacity="0" pointer-events="none"/>
              <circle id="curve-hover-dot" cx="0" cy="0" r="4.5" fill="var(--c-agent)" stroke="#ffffff" stroke-width="1.5" opacity="0" pointer-events="none"/>
              <rect id="curve-hit-area" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="transparent" style="cursor:crosshair;"/>
            </svg>
          </div>
          <div class="curve-tooltip" id="curve-tooltip-bar">
            <div class="curve-tooltip-main num">
              <span class="dim">Peak: <strong>${fmtTok(maxTok)}</strong> · Net: <strong>${growth >= 0 ? '+' : ''}${fmtTok(growth)}</strong></span>
            </div>
          </div>
          <div class="curve-legend">
            <div class="curve-legend-items">
              <span class="curve-legend-item">
                <svg width="18" height="10" viewBox="0 0 18 10" style="flex:none;">
                  <line x1="1" y1="5" x2="17" y2="5" stroke="var(--c-agent)" stroke-width="2.2" stroke-linecap="round"/>
                  <circle cx="9" cy="5" r="2.8" fill="var(--c-agent)" stroke="var(--surface)" stroke-width="1"/>
                </svg>
                <span>Context tokens</span>
              </span>
              <span class="curve-legend-item">
                <svg width="12" height="10" viewBox="0 0 12 10" style="flex:none;">
                  <circle cx="6" cy="5" r="3.5" fill="var(--c-user)" stroke="var(--surface)" stroke-width="1.2"/>
                </svg>
                <span>User prompt</span>
              </span>
              ${hasDrops ? `
              <span class="curve-legend-item">
                <svg width="12" height="10" viewBox="0 0 12 10" style="flex:none;">
                  <circle cx="6" cy="5" r="3.5" fill="#81c995" stroke="var(--surface)" stroke-width="1.2"/>
                </svg>
                <span>Compaction drop</span>
              </span>` : ''}
              ${budget > 0 && budget <= yMax ? budgetLegendHtml : ''}
            </div>
            ${budget > 0 && budget > yMax ? budgetLegendHtml : ''}
          </div>
        </div>
      </section>`;
  }

  function setupGrowthCurve(r) {
    const t = r.telemetry;
    if (!t || !Array.isArray(t.turns_curve) || !t.turns_curve.length) return;
    const curve = t.turns_curve;
    const N = curve.length;
    const maxTok = Math.max(...curve.map((c) => c.prompt_tokens || 0), 100);
    const { yMax } = calculateYScale(maxTok);

    const padL = 46;
    const padR = 14;
    const padT = 18;
    const padB = 26;
    const plotW = 340 - padL - padR;
    const plotH = 150 - padT - padB;
    const plotBottom = padT + plotH;

    const pts = curve.map((turn, i) => {
      const x = N > 1 ? padL + (i / (N - 1)) * plotW : padL + plotW / 2;
      const y = plotBottom - Math.min(plotH, Math.max(0, ((turn.prompt_tokens || 0) / yMax) * plotH));
      return { x, y, turn, i };
    });

    const hitArea = document.getElementById('curve-hit-area');
    const crosshair = document.getElementById('curve-crosshair');
    const hoverDot = document.getElementById('curve-hover-dot');
    const tooltipBar = document.getElementById('curve-tooltip-bar');
    if (!hitArea || !crosshair || !hoverDot || !tooltipBar) return;

    function findClosest(e) {
      const rect = hitArea.getBoundingClientRect();
      const relX = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const targetSvgX = padL + relX * plotW;
      let best = pts[0];
      let bestDist = Math.abs(pts[0].x - targetSvgX);
      for (let i = 1; i < pts.length; i++) {
        const dist = Math.abs(pts[i].x - targetSvgX);
        if (dist < bestDist) {
          bestDist = dist;
          best = pts[i];
        }
      }
      return best;
    }

    hitArea.addEventListener('pointermove', (e) => {
      const pt = findClosest(e);
      crosshair.setAttribute('x1', pt.x.toFixed(1));
      crosshair.setAttribute('x2', pt.x.toFixed(1));
      crosshair.style.opacity = '0.75';

      hoverDot.setAttribute('cx', pt.x.toFixed(1));
      hoverDot.setAttribute('cy', pt.y.toFixed(1));
      hoverDot.style.opacity = '1';
      if (pt.turn.user_prompt) {
        hoverDot.setAttribute('fill', 'var(--c-user)');
      } else if (pt.turn.context_delta < 0) {
        hoverDot.setAttribute('fill', '#81c995');
      } else {
        hoverDot.setAttribute('fill', 'var(--c-agent)');
      }

      const delta = pt.turn.context_delta || 0;
      const deltaStr = (delta >= 0 ? '+' : '') + fmtTok(delta);
      const userTag = pt.turn.user_prompt ? '<span class="turn-tag user">user</span>' : '';
      const toolTag = pt.turn.tool_count > 0 ? `<span class="turn-tag">${pt.turn.tool_count}t</span>` : '';
      const snippet = pt.turn.user_prompt
        ? esc(pt.turn.user_prompt)
        : (pt.turn.tool_summary ? esc(pt.turn.tool_summary) : (pt.turn.timestamp ? esc(pt.turn.timestamp) : ''));

      tooltipBar.innerHTML = `
        <div class="curve-tooltip-main num">
          <strong>#${pt.turn.step}</strong>
          <span>${fmtTok(pt.turn.prompt_tokens)} tok</span>
          <span class="dim">(${deltaStr})</span>
          <span class="dim">· cache ${pt.turn.cache_hit_pct}%</span>
          ${userTag}
          ${toolTag}
          ${snippet ? `<span class="curve-tooltip-preview dim">${snippet}</span>` : ''}
        </div>
      `;
    });

    hitArea.addEventListener('pointerleave', () => {
      crosshair.style.opacity = '0';
      hoverDot.style.opacity = '0';
      tooltipBar.innerHTML = `
        <div class="curve-tooltip-main num">
          <span class="dim">Peak: <strong>${fmtTok(maxTok)}</strong> · Net: <strong>${growth >= 0 ? '+' : ''}${fmtTok(growth)}</strong></span>
        </div>
      `;
    });

    hitArea.addEventListener('click', (e) => {
      const pt = findClosest(e);
      selectedTurnStep = pt.turn.step;
      const allTurns = (t && Array.isArray(t.recent_turns)) ? t.recent_turns : [];
      const isBeyondRecent = allTurns.findIndex((tr) => tr.step === pt.turn.step) >= 12;
      if (isBeyondRecent && !showAllTurns) {
        showAllTurns = true;
        render(r);
      }
      setTimeout(() => {
        const det = document.querySelector(`details.turn-item[data-step="${pt.turn.step}"]`);
        if (det) {
          det.open = true;
          det.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          det.style.borderColor = 'var(--c-agent)';
          setTimeout(() => { det.style.borderColor = ''; }, 1200);
        }
      }, 50);
    });
  }

  function telemetrySection(r) {
    const t = r.telemetry;
    if (!t || !t.latest) return '';
    const cur = t.latest;
    const sum = t.summary || {};
    return `
      <section>
        <h2>Performance <span class="hint">Step #${cur.step} · ${t.total_calls} turns</span></h2>
        <div class="group">
          <div class="row"><span class="mark" style="background:#81c995"></span><span>Output speed (latest / peak)</span><span class="tok num">${cur.output_tps} t/s</span><span class="p num">${sum.peak_output_tps || 0}</span></div>
          <div class="row"><span class="mark" style="background:#4c8df6"></span><span>First token TTFT (latest / avg)</span><span class="tok num">${fmtSec(cur.ttft_ms)}</span><span class="p num">${fmtSec(sum.avg_ttft_ms)}</span></div>
          <div class="row"><span class="mark" style="background:#a8c7fa"></span><span>Prefill throughput (latest / avg)</span><span class="tok num">${fmtTok(cur.prefill_tps)}/s</span><span class="p num">${fmtTok(sum.avg_prefill_tps || 0)}/s</span></div>
          <div class="row"><span class="mark" style="background:#f9ab00"></span><span>Cache hit (latest / session)</span><span class="tok num">${cur.cache_hit_pct}%</span><span class="p num">${sum.overall_cache_hit_pct || 0}%</span></div>
          <div class="row"><span class="mark sq" style="background:#c58af9"></span><span>Turn output (total / think)</span><span class="tok num">${fmtTok(cur.output_tokens)}</span><span class="p num">${fmtTok(cur.thinking_tokens)}</span></div>
          <div class="row"><span class="mark sq" style="background:#9aa0a6"></span><span>Session output (total / think)</span><span class="tok num">${fmtTok(sum.sum_output_tokens || 0)}</span><span class="p num">${fmtTok(sum.sum_thinking_tokens || 0)}</span></div>
        </div>
      </section>`;
  }

  function renderTurnDetail(tr) {
    const cachePct = Math.min(100, Math.max(0, Number(tr.cache_hit_pct) || 0));
    const freshPct = Math.max(0, 100 - cachePct);
    const outTotal = Math.max(1, Number(tr.output_tokens) || 1);
    const thinkPct = Math.min(100, Math.max(0, ((Number(tr.thinking_tokens) || 0) / outTotal) * 100));
    const respPct = Math.max(0, 100 - thinkPct);
    const delta = Number(tr.context_delta) || 0;
    const deltaStr = (delta >= 0 ? '+' : '') + fmtTok(delta);

    const tools = Array.isArray(tr.tools) ? tr.tools : [];
    const toolsHtml = tools.length
      ? `<div class="td-box">
          <div class="td-box-head">
            <span>Tool calls (${tools.length})</span>
            <span class="num">+${fmtTok(tr.tool_tokens || 0)} tok</span>
          </div>
          <div class="td-tools">
            ${tools.map((tc) => `
              <div class="td-tool-row" title="${esc(tc.summary)}">
                <span class="td-tool-icon">${SVG_TOOL}</span>
                <span class="td-tool-name">${esc(tc.name)}</span>
                <span class="td-tool-sum">${esc(tc.summary || '')}</span>
                <span class="td-tool-tok">+${fmtTok(tc.tokens || 0)}</span>
              </div>
            `).join('')}
          </div>
        </div>`
      : '';

    const userHtml = tr.user_prompt
      ? `<div class="td-box">
          <div class="td-box-head">
            <span style="color:var(--c-user)">User input</span>
            <span class="num">${fmtTok(tr.user_tokens || 0)} tok</span>
          </div>
          <div class="td-snippet">${esc(tr.user_prompt)}</div>
        </div>`
      : '';

    const thinkHtml = tr.thinking_preview
      ? `<div class="td-box">
          <div class="td-box-head">
            <span>Thinking snippet</span>
            <span class="num">${fmtTok(tr.thinking_tokens || 0)} tok</span>
          </div>
          <div class="td-snippet dim">${esc(tr.thinking_preview)}</div>
        </div>`
      : '';

    const respHtml = tr.response_preview
      ? `<div class="td-box">
          <div class="td-box-head">
            <span>Response snippet</span>
            <span class="num">${fmtTok(tr.response_tokens || 0)} tok</span>
          </div>
          <div class="td-snippet">${esc(tr.response_preview)}</div>
        </div>`
      : '';

    return `
      <div class="turn-detail">
        <div class="td-meta">
          <span class="num">Turn #${tr.step}${tr.traj_step !== undefined ? ` · Step #${tr.traj_step}` : ''}${tr.timestamp ? ` · ${esc(tr.timestamp)}` : ''}</span>
          <span class="num">Delta ${deltaStr}${tr.trace_id ? ` · ${esc(tr.trace_id.slice(0, 12))}` : ''}</span>
        </div>
        <div class="td-cards">
          <div class="td-card">
            <div class="td-card-title">Context &amp; Prefill</div>
            <div class="td-bar">
              <div style="width:${cachePct.toFixed(1)}%;background:#f9ab00"></div>
              <div style="width:${freshPct.toFixed(1)}%;background:#4c8df6"></div>
            </div>
            <div class="td-kv"><span class="k">Prompt total</span><span class="v">${(tr.prompt_tokens || 0).toLocaleString()}</span></div>
            <div class="td-kv"><span class="k">Cache read</span><span class="v">${(tr.cache_read_tokens || 0).toLocaleString()} (${cachePct}%)</span></div>
            <div class="td-kv"><span class="k">Fresh input</span><span class="v">${(tr.input_tokens || 0).toLocaleString()}</span></div>
            <div class="td-kv"><span class="k">Prefill speed</span><span class="v">${fmtTok(tr.prefill_tps || 0)}/s</span></div>
          </div>
          <div class="td-card">
            <div class="td-card-title">Output &amp; Latency</div>
            <div class="td-bar">
              <div style="width:${thinkPct.toFixed(1)}%;background:#c58af9"></div>
              <div style="width:${respPct.toFixed(1)}%;background:#81c995"></div>
            </div>
            <div class="td-kv"><span class="k">Output total</span><span class="v">${(tr.output_tokens || 0).toLocaleString()}</span></div>
            <div class="td-kv"><span class="k">Think / Resp</span><span class="v">${(tr.thinking_tokens || 0).toLocaleString()} / ${(tr.response_tokens || 0).toLocaleString()}</span></div>
            <div class="td-kv"><span class="k">TTFT / Stream</span><span class="v">${fmtSec(tr.ttft_ms)} / ${fmtSec(tr.stream_ms)}</span></div>
            <div class="td-kv"><span class="k">Total / Speed</span><span class="v">${fmtSec(tr.total_ms)} · ${tr.output_tps} t/s</span></div>
          </div>
        </div>
        ${userHtml}
        ${toolsHtml}
        ${thinkHtml}
        ${respHtml}
      </div>`;
  }

  function turnsSection(r) {
    const t = r.telemetry;
    if (!t || !Array.isArray(t.recent_turns) || !t.recent_turns.length) return '';
    const allTurns = t.recent_turns;
    const visibleTurns = showAllTurns ? allTurns : allTurns.slice(0, 12);
    const toggleBtn = allTurns.length > 12
      ? `<button type="button" id="toggle-turns-btn" style="padding:1px 6px;font-size:10.5px;">${showAllTurns ? 'Recent 12' : `All ${allTurns.length}`}</button>`
      : '';

    const turnsHtml = visibleTurns.map((tr) => {
      const isOpen = selectedTurnStep === tr.step;
      const toolCount = Array.isArray(tr.tools) ? tr.tools.length : 0;
      return `
        <details class="turn-item" name="turn-inspector" data-step="${tr.step}" ${isOpen ? 'open' : ''}>
          <summary class="turn-summary" title="Turn #${tr.step}">
            <span class="turn-chev">${SVG_CHEVRON}</span>
            <span class="dim num">#${tr.step}</span>
            <span class="turn-main num">
              <span>${fmtTok(tr.prompt_tokens)} <span class="dim">(${tr.cache_hit_pct}%)</span></span>
              ${tr.user_prompt ? '<span class="turn-tag user">user</span>' : ''}
              ${toolCount > 0 ? `<span class="turn-tag">${toolCount}t</span>` : ''}
            </span>
            <span class="num" style="text-align:right">${fmtTok(tr.output_tokens)}<span class="dim">/${fmtTok(tr.thinking_tokens)}</span></span>
            <span class="num dim" style="text-align:right">${fmtSec(tr.ttft_ms)}</span>
            <span class="num" style="text-align:right">${tr.output_tps} t/s</span>
          </summary>
          ${renderTurnDetail(tr)}
        </details>`;
    }).join('');

    return `
      <section>
        <h2>
          <span>Recent turns</span>
          ${toggleBtn}
        </h2>
        <div class="turn-list">${turnsHtml}</div>
      </section>`;
  }

  function render(r) {
    const scrollY = window.scrollY;
    const limit = r.limit_tokens;
    const cid = r.conversation_id || initialConversationId;
    main.innerHTML = `
      <div class="top">
        <div class="model"><span class="live on" title="Live"></span>${esc(r.model)}</div>
        <button id="copy" title="Copy report">Copy as text</button>
      </div>
      <div class="usage">
        <span class="big num">${fmtTok(r.used_tokens)}</span>
        <span class="of">/ ${limit ? fmtTok(limit) : 'Unknown'} tokens</span>
        ${limit ? `<span class="pct num">${r.used_pct.toFixed(1)}%</span>` : ''}
      </div>
      ${grid(r)}
      ${categories(r)}
      ${growthCurveSection(r)}
      ${telemetrySection(r)}
      ${turnsSection(r)}
      ${checkpoints(r)}
      ${files('Knowledge files', '/rules', r.knowledge_files, cid)}
      ${files('Artifact files', '/artifact', r.artifact_files, cid)}
      ${files('Skill files', '/skill', r.skill_files, cid)}
      ${files('System files', 'auto-loaded', r.system_files, cid)}
      <footer><span>Related: /artifact · /skill · /rewind</span><span>Updated ${esc(new Date(r.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))}</span></footer>`;

    document.getElementById('copy').addEventListener('click', copy);
    setupGrowthCurve(r);

    const toggleBtn = document.getElementById('toggle-turns-btn');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        showAllTurns = !showAllTurns;
        render(r);
      });
    }

    document.querySelectorAll('details.turn-item').forEach((det) => {
      det.addEventListener('toggle', () => {
        const step = Number(det.dataset.step);
        if (det.open) {
          selectedTurnStep = step;
        } else if (selectedTurnStep === step) {
          selectedTurnStep = null;
        }
      });
    });

    if (scrollY > 0) {
      window.scrollTo(0, scrollY);
    }
  }

  function showMessage(text) {
    report = null;
    lastJson = '';
    main.innerHTML = `<p class="empty">${esc(text)}</p>`;
  }

  async function copy(event) {
    if (!report) return;
    try {
      await navigator.clipboard.writeText(report.text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = report.text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    const btn = event.currentTarget;
    btn.textContent = 'Copied';
    setTimeout(() => { btn.textContent = 'Copy as text'; }, 1500);
  }

  async function refresh() {
    if (document.hidden && report !== null) return;
    try {
      const qs = new URLSearchParams({ conversationId: initialConversationId, workspace });
      const res = await doFetch(`/api/report?${qs}`);
      const data = await res.json();
      if (data.error === 'no-conversation') return showMessage('Open a conversation to see its context usage.');
      if (data.error === 'no-database') return showMessage('This conversation has no saved data yet. Send a message first.');
      if (data.error) return showMessage(`Couldn't read this conversation: ${data.message || data.error}`);
      const compareObj = { ...data, updatedAt: '' };
      const json = JSON.stringify(compareObj);
      if (json === lastJson) return;
      lastJson = json;
      report = data;
      render(data);
    } catch {
      const dot = document.querySelector('.live');
      if (dot) dot.classList.remove('on');
    }
  }

  document.addEventListener('visibilitychange', refresh);

  function start() {
    refresh();
    setInterval(refresh, POLL_MS);
    if (window.sidecar && window.sidecar.getWorkspaceUris) {
      window.sidecar.getWorkspaceUris().then((uris) => {
        if (Array.isArray(uris) && (uris[0] || '') !== workspace) {
          workspace = uris[0] || '';
          lastJson = '';
          refresh();
        }
      }).catch(() => {});
      if (window.sidecar.onWorkspaceChange) {
        window.sidecar.onWorkspaceChange((next) => {
          if (Array.isArray(next) && (next[0] || '') !== workspace) {
            workspace = next[0] || '';
            lastJson = '';
            refresh();
          }
        });
      }
    }
  }
  start();
})();
</script>
